name: Atualizar Cadastros pelo Site (planilha)
on:
  schedule:
    # 3x por dia, em minuto "quebrado" (no horário cheio o GitHub às vezes pula)
    - cron: '23 11,16,21 * * *'  # 08:23, 13:23 e 18:23 no horário de Brasília (UTC-3)
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" do GitHub
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Copiar cadastros do site para a planilha
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/exportar-cadastros-site.cjs
