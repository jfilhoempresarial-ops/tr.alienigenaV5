name: Atualizar Pontos de Parada e Descanso (PPD)
on:
  schedule:
    # 2x por dia, em minutos "quebrados": no horário cheio (ex: 09:00) o
    # GitHub fica sobrecarregado e às vezes atrasa ou pula a execução.
    - cron: '17 9 * * *'   # 06:17 no horário de Brasília (UTC-3)
    - cron: '17 21 * * *'  # 18:17 no horário de Brasília (UTC-3)
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" do GitHub
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Buscar e gravar PPDs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/buscar-ppd-gov.cjs
