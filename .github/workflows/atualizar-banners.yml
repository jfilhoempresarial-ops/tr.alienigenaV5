name: Atualizar aba Banners (planilha)
on:
  schedule:
    - cron: '47 10 * * *'  # 07:47 no horário de Brasília (UTC-3), 1x por dia
  workflow_dispatch: {}    # permite rodar manualmente pela aba "Actions" do GitHub
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Montar aba Banners
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/exportar-banners.cjs
