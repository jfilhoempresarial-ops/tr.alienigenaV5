name: Atualizar Cotações (fita do topo)
on:
  schedule:
    - cron: '0 9 * * *'  # 06:00 no horário de Brasília (UTC-3), 1x por dia
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" do GitHub
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install googleapis firebase-admin
      - name: Sincronizar cotações
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/sincronizar-cotacoes.cjs
