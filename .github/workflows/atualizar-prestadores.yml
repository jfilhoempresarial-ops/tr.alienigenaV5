name: Atualizar Prestadores (planilha)
on:
  schedule:
    - cron: '0 11,16,21 * * *'  # 08:00, 13:00 e 18:00 no horário de Brasília (UTC-3), 3x por dia
  workflow_dispatch: {}    # permite rodar manualmente pela aba "Actions" do GitHub
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install googleapis firebase-admin
      - name: Sincronizar prestadores com a planilha
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/sincronizar-prestadores.cjs
