name: Atualizar eventos

# Roda 1x por dia (pra remover sozinho qualquer evento cuja data já passou,
# mesmo que ninguém edite o arquivo) E automaticamente sempre que
# scripts/eventos.json for alterado e enviado pro branch main (ex: editando
# pelo app do GitHub no celular). Também pode ser disparado manualmente pela
# aba Actions (botão "Run workflow").
on:
  schedule:
    - cron: '0 9 * * *'  # 06:00 horário de Brasília (09:00 UTC), todo dia
  push:
    branches:
      - main
    paths:
      - 'scripts/eventos.json'
      - 'scripts/sincronizar-eventos.cjs'
  workflow_dispatch: {}

jobs:
  atualizar-eventos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install firebase-admin

      - name: Rodar sincronizar-eventos.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/sincronizar-eventos.cjs
